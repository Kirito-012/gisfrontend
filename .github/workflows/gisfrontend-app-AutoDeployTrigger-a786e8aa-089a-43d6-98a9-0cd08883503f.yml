name: Trigger auto deployment for gisfrontend-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/gisfrontend-app-AutoDeployTrigger-a786e8aa-089a-43d6-98a9-0cd08883503f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.GISFRONTENDAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.GISFRONTENDAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.GISFRONTENDAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: gishrda.azurecr.io
          registryUsername: ${{ secrets.GISFRONTENDAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.GISFRONTENDAPP_REGISTRY_PASSWORD }}
          containerAppName: gisfrontend-app
          resourceGroup: droneWaste
          imageToBuild: gishrda.azurecr.io/gisfrontend-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


